  <style>
    #a2hs{margin:10px 0 0 auto;max-width:300px;font:500 13px/1.35 Barlow,system-ui,sans-serif;color:#fff0d7;background:#07363bd9;border:1px solid #fff0d733;border-radius:10px;padding:8px 30px 8px 12px;position:relative;text-align:left}
    #a2hs[hidden]{display:none}
    #a2hs b{font-weight:700;color:#fff}
    #a2hs>button{all:unset;position:absolute;top:4px;right:6px;width:22px;height:22px;display:grid;place-items:center;font:18px/1 system-ui,sans-serif;color:#fff0d7;cursor:pointer;opacity:.8}
    #a2hs>button::before,#a2hs>button::after{content:none!important;display:none!important}
  </style>
  <title>Highline · Satellite Beach, FL</title>
</head>
<body>
  <main id="game">
    <canvas id="unity-canvas" width="1280" height="720" tabindex="0" aria-label="Highline surfing game"></canvas>
    <section id="loading" aria-label="Highline start screen">
      <img class="keyart" src="Brand/highline.png" alt="Highline — a surfer on a red board inside a sunlit turquoise wave, with the cream and red Highline wordmark above Hightower Beach">
      <canvas id="hero-motion" class="ocean-motion" aria-hidden="true"></canvas><div class="shade" aria-hidden="true"></div>
      <h1 class="sr-only">Highline</h1>
      <div class="launch">
        <h2>Satellite Beach, FL</h2>
        <div class="ready"><progress id="progress" value="0" max="1" aria-label="Loading Highline"></progress><p id="status" role="status" aria-live="polite">Loading…</p><button id="enter" hidden>Let it rip</button><p id="a2hs" hidden>For full screen, tap <b>Share</b> then <b>Add to Home Screen</b> and launch Highline from there.<button type="button" aria-label="Dismiss">×</button></p></div>
      </div>
    </section>
    <div id="entry-swell" aria-hidden="true"></div>
    <aside id="rotate"><span class="rotate-mark" aria-hidden="true">Highline</span><h2>Rotate to landscape.</h2></aside>
  </main>
  <script>
    const canvas=document.getElementById('unity-canvas');
    // A shared web invitation remains playable here and can also enter an installed
    // iOS app by an explicit tap. No Universal Link entitlement or auto-launch assumed.
    try {
      const incoming=new URL(location.href),invite=incoming.searchParams.get('invite')||new URLSearchParams(incoming.hash.slice(1)).get('invite');
      if(invite&&invite.length<=1024&&/^HLI\d+\.[A-Za-z0-9_-]+\.[a-f0-9]{16}$/.test(invite)){
        const link=document.createElement('a');link.id='open-highline-app';link.href='highline://invite/'+invite;
        link.textContent='Open in Highline for iOS';link.style.cssText='display:block;color:#fff0d7;font:14px system-ui;margin-top:12px;text-decoration:underline';
        document.querySelector('.ready').appendChild(link);
      }
    } catch(error) { /* The game handles malformed invitations after loading. */ }
    // Full inspection is demand-driven. Ordinary surfing does not allocate and
    // parse a large diagnostic snapshot every display frame.
    window.render_game_to_text=()=>{
      window.surfUnity?.SendMessage('Hightower Surf Demo','RefreshSnapshot');
      return JSON.stringify(window.surfState||{mode:'loading'});
    };
    // Register before Unity: entering the shell must not also activate the
    // currently selected Unity menu action behind it.
    window.addEventListener('keydown',event=>{
      if((!document.getElementById('loading').hidden||window.highlineEntering)&&['Enter',' ','ArrowDown','ArrowUp'].includes(event.key)){
        event.preventDefault();event.stopImmediatePropagation();
        if((event.key==='Enter'||event.key===' ')&&!document.getElementById('enter').hidden&&!matchMedia('(orientation: portrait)').matches)document.getElementById('enter').click();
      }
    },true);
    let unity;
    const motion=matchMedia('(prefers-reduced-motion: reduce)');
    const syncMotion=()=>unity?.SendMessage('Hightower Surf Demo','SetMenuSystemMotion',motion.matches?'reduced':'full');
    motion.addEventListener('change',syncMotion);
    // Portrait: the rotate overlay is only a picture unless the game also stops
    // listening. Hold input and pause an active ride while upright; restore the
    // previous pause state on return to landscape (handled in SetPortraitHold).
    const portrait=matchMedia('(orientation: portrait)');
    const syncPortrait=()=>unity?.SendMessage('Hightower Surf Demo','SetPortraitHold',portrait.matches?'1':'0');
    portrait.addEventListener('change',syncPortrait);
    window.highlinePortraitHeld=()=>portrait.matches;
    const ready=new Promise(resolve=>window.surfReady=resolve);
    window.advanceTime=async ms=>{
      await ready;
      if(window.highlineTransition)await window.highlineTransition;
      while(!window.surfState)await new Promise(requestAnimationFrame);
      await new Promise(requestAnimationFrame);
      unity.SendMessage('Hightower Surf Demo','Advance',String(ms));
      await new Promise(requestAnimationFrame);
    };
    const fail=message=>{const status=document.getElementById('status');status.textContent=message;status.hidden=false;document.getElementById('progress').hidden=true;console.error(message);};
    // Keep the poster opaque until Unity has painted the destination at the
    // current size. Two subsequent frames allow submitted GUI work to present.
    async function waitForMenuPaint(){
      const after=window.highlineMenuPaint?.frame??-1;
      let elapsed=0,last=performance.now();
      while(elapsed<30000){
        await new Promise(requestAnimationFrame);
        const now=performance.now();
        // Waiting at the rotation prompt or in a background tab is not a load failure.
        if(!document.hidden&&canvas.clientWidth>=canvas.clientHeight)elapsed+=Math.min(now-last,1000);
        last=now;
        const paint=window.highlineMenuPaint,ratio=window.highlineMenuResolution?.ratio??Math.min(devicePixelRatio||1,3);
        if(paint?.ready&&paint.frame>=after+2&&paint.width===canvas.width&&paint.height===canvas.height&&Math.abs(canvas.width-canvas.clientWidth*ratio)<2)return paint;
      }
      throw Error('The menu could not finish drawing. Please reload.');
    }
    const script=document.createElement('script');script.src='Build/TouchDemo.loader.js';
    script.onerror=()=>fail('The beach could not load. Check your connection and reload.');
    script.onload=()=>createUnityInstance(canvas,{
      dataUrl:'Build/TouchDemo.data',frameworkUrl:'Build/TouchDemo.framework.js',codeUrl:'Build/TouchDemo.wasm',
      streamingAssetsUrl:'StreamingAssets',companyName:'King Made',productName:'Highline',productVersion:'0.38.0',
      devicePixelRatio:Math.min(window.devicePixelRatio||1,3),matchWebGLToCanvasSize:true,
      showBanner:(message,type)=>{if(type==='error')fail(message);}
    },p=>document.getElementById('progress').value=p).then(async instance=>{
      unity=instance;window.surfUnity=unity;unity.SendMessage('Hightower Surf Demo','SetMenuShellVisible','1');syncMotion();syncPortrait();window.surfReady();
      await waitForMenuPaint();window.highlineEntryReady=true;
      document.getElementById('progress').hidden=true;document.getElementById('status').textContent='';document.getElementById('status').hidden=true;document.getElementById('enter').hidden=false;
    }).catch(error=>fail('The beach could not start. Please reload. '+error.message));
    document.body.appendChild(script);
    const standalone=matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
    const iOS=/iP(hone|od|ad)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    const hint=document.getElementById('a2hs');
    let hintDismissed=false;try{hintDismissed=localStorage.getItem('highline.a2hs')==='1';}catch(e){}
    if(iOS&&!standalone&&!hintDismissed)hint.hidden=false;
    hint.querySelector('button').onclick=()=>{hint.hidden=true;try{localStorage.setItem('highline.a2hs','1');}catch(e){}};
    const goFullscreen=()=>{
      if(standalone||iOS||document.fullscreenElement||!document.fullscreenEnabled)return;
      const game=document.getElementById('game');
      game.requestFullscreen({navigationUI:'hide'}).then(()=>screen.orientation?.lock?.('landscape').catch(()=>{})).catch(()=>{});
    };
    document.getElementById('enter').onclick=event=>{
      if(!window.highlineEntryReady||window.highlineEntering||document.getElementById('loading').hidden||matchMedia('(orientation: portrait)').matches)return;
      // Resume Unity's real context while this click/key activation is still live,
      // before fullscreen or the asynchronous entry transition can consume it.
      window.highlineAudio?.enter(event);
      goFullscreen();
      const shell=document.getElementById('loading'),button=document.getElementById('enter');
      const reduced=motion.matches||window.surfState?.reducedMotion;
      window.highlineEntering=true;button.disabled=true;
      unity?.SendMessage('Hightower Surf Demo','SetMenuPhase','3');
      window.highlineTransition=(async()=>{
        try{
          const paint=await waitForMenuPaint();
          window.highlineEntryPaint=paint;
          if(!reduced){
            shell.classList.add('entering');
            await new Promise(resolve=>setTimeout(resolve,180));
          }
          shell.hidden=true;window.highlineHero?.dispose();
          unity.SendMessage('Hightower Surf Demo','SetMenuShellVisible','0');
          window.highlineEntering=false;canvas.focus();
        }catch(error){shell.classList.remove('entering');window.highlineEntering=false;button.disabled=false;fail(error.message);}
      })();
    };
    document.addEventListener('keydown',event=>{if(event.key.toLowerCase()==='f'&&unity)unity.SetFullscreen(document.fullscreenElement?0:1);});
    canvas.addEventListener('contextmenu',event=>event.preventDefault());
  </script>
  <script src="Brand/hero.js"></script>
</body>
</html>
